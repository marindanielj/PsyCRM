# Deploy PsyCRM to AWS (docs/psycrm/INFRA_AWS.md §4, infra/README.md).
#
# push to main → test → [manual approval: environment "production"] → build ARM64 image → ECR →
# run migrations as a one-off ECS task → update the service → wait until it is stable.
# No AWS keys are stored: the job assumes the role created by infra/ through GitHub OIDC.
#
# One-time setup in GitHub: Settings → Environments → "production" (required reviewers) and a
# repository variable AWS_DEPLOY_ROLE_ARN = the DeployRoleArn output of the Psycrm stack.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  CLUSTER: psycrm
  SERVICE: psycrm-app
  REPOSITORY: psycrm-app

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    permissions:
      id-token: write # OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Prints the claims GitHub presents to AWS (not secret: no token is printed). The deploy role's
      # trust policy requires sub == repo:<owner>/<repo>:environment:production, so when AWS says
      # "Not authorized to perform sts:AssumeRoleWithWebIdentity", compare this with the role.
      - name: Show the OIDC claims this job presents
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          req = urllib.request.Request(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com",
                                       headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          token = json.load(urllib.request.urlopen(req))["value"]
          body = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(body + "=" * (-len(body) % 4)))
          print(json.dumps({k: claims.get(k) for k in ("sub", "aud", "repository", "environment", "ref", "job_workflow_ref")}, indent=2))
          PY

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: psycrm-deploy-${{ github.run_id }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - name: Build and push the image (tag = commit SHA; tags are immutable)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ github.sha }}

      - name: Register new task definition revisions with this image
        id: taskdefs
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          register() {
            family="$1"
            aws ecs describe-task-definition --task-definition "$family" --query taskDefinition > "$family.json"
            jq --arg image "$IMAGE" '
              .containerDefinitions[0].image = $image
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
            ' "$family.json" > "$family.new.json"
            aws ecs register-task-definition --cli-input-json "file://$family.new.json" --query taskDefinition.taskDefinitionArn --output text
          }
          echo "app=$(register psycrm-app)" >> "$GITHUB_OUTPUT"
          echo "migrate=$(register psycrm-migrate)" >> "$GITHUB_OUTPUT"

      - name: Run migrations (one-off task; the deploy stops if it fails)
        env:
          MIGRATE_TASK: ${{ steps.taskdefs.outputs.migrate }}
        run: |
          set -euo pipefail
          net=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].networkConfiguration' --output json)
          task=$(aws ecs run-task --cluster "$CLUSTER" --launch-type FARGATE --task-definition "$MIGRATE_TASK" \
            --network-configuration "$net" --count 1 --query 'tasks[0].taskArn' --output text)
          echo "migration task: $task"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task"
          code=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task" --query 'tasks[0].containers[0].exitCode' --output text)
          echo "exit code: $code"
          test "$code" = "0"

      - name: Update the service and wait for it to be stable (the circuit breaker rolls back a bad release)
        env:
          APP_TASK: ${{ steps.taskdefs.outputs.app }}
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$APP_TASK" > /dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].{running:runningCount,desired:desiredCount,taskDefinition:taskDefinition}'
